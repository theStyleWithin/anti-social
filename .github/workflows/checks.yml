name: Checks
# quick checks that run on every push and pull request
on:
  push:
  pull_request:

jobs:
  export-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # accounts must carry everything when exported: see tools/check-export.js and the rule in www/acctcore.js
      - run: node tools/check-export.js
