name: Build apps

# Run it by hand (Actions tab -> Build apps -> Run workflow). It builds every installer
# and publishes them as a GitHub Release named after the version in desktop/package.json.
# Pushing a v* tag does the same.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
        env:
          NODE_LLAMA_CPP_SKIP_DOWNLOAD: 'true'
      - name: Build installers
        shell: bash
        run: |
          set +e
          npm run dist 2>&1 | tee dist.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then echo "::error::$(grep -iE 'error|cannot|enoent|fail|exit' dist.log | tail -10 | tr '\n' '|' | cut -c1-1500)"; exit "$code"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Fetch the AI engine source (llama.cpp, pinned)
        run: |
          git init mobile/android/llama.cpp
          git -C mobile/android/llama.cpp remote add origin https://github.com/ggml-org/llama.cpp.git
          git -C mobile/android/llama.cpp fetch --depth 1 origin tag v0.7.0
          git -C mobile/android/llama.cpp checkout FETCH_HEAD
      - name: Sync web app into the Android project
        working-directory: mobile
        run: |
          npm ci
          npx cap sync android
      - name: Set up the signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            # Your permanent key (repo secrets): updates install over old versions.
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/anti-social.jks"
            PASS="$KEYSTORE_PASSWORD"
          else
            # No secret set: throwaway key. Fine for testing, but each build has a different
            # signature, so Android will not update an installed copy.
            PASS=$(openssl rand -hex 16)
            keytool -genkeypair -keystore "$RUNNER_TEMP/anti-social.jks" -alias antisocial \
              -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=Anti-Social, O=Anti-Social, C=US"
          fi
          echo "AS_KEYSTORE=$RUNNER_TEMP/anti-social.jks" >> "$GITHUB_ENV"
          echo "::add-mask::$PASS"
          echo "AS_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
      - name: Build release APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleRelease --no-daemon 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then echo "::error::$(grep -E 'error|Error|FAILED|What went wrong' -A2 build.log | head -30 | tr '\n' '|' | cut -c1-1800)"; exit "$code"; fi
      - name: Name the APK
        run: |
          VERSION=$(node -p "require('./desktop/package.json').version")
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "Anti-Social-$VERSION-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Anti-Social-*-android.apk
          if-no-files-found: error

  consoles:
    # experimental: if a console build breaks, the Windows, Linux and Android release still goes out
    uses: ./.github/workflows/consoles.yml

  release:
    needs: [desktop, android, consoles]
    if: ${{ !cancelled() && needs.desktop.result == 'success' && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./desktop/package.json').version")
          TAG="v$VERSION"
          # console files (if they built), named like the other downloads
          rm -f out/anti-social.elf
          for f in out/anti-social.*; do [ -e "$f" ] || continue; ext="${f##*.}"; case $ext in nro) t=switch;; rpx|wuhb) t=wiiu;; 3dsx|cia) t=3ds;; *) continue;; esac; mv "$f" "out/Anti-Social-$VERSION-$t.$ext"; done
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* --target "$GITHUB_SHA" \
              --title "$TAG: nobody is here" \
              --notes "Windows installer + portable exe, Linux AppImage + deb, Android APK. Experimental console builds (native, not a web app): Nintendo Switch .nro, Wii U .rpx and .wuhb, 3DS .3dsx and .cia, when they built. Terms of Use: TOUCH GRASS."
          fi
