name: Build apps

# Run it by hand (Actions tab -> Build apps -> Run workflow). It builds every installer
# and publishes them as a GitHub Release named after the version in desktop/package.json.
# Pushing a v* tag does the same.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            desktop/dist/*.AppImage
            desktop/dist/*.deb
            desktop/dist/*.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Sync web app into the Android project
        working-directory: mobile
        run: |
          npm ci
          npx cap sync android
      - name: Set up the signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            # Your permanent key (repo secrets): updates install over old versions.
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/anti-social.jks"
            PASS="$KEYSTORE_PASSWORD"
          else
            # No secret set: throwaway key. Fine for testing, but each build has a different
            # signature, so Android will not update an installed copy.
            PASS=$(openssl rand -hex 16)
            keytool -genkeypair -keystore "$RUNNER_TEMP/anti-social.jks" -alias antisocial \
              -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PASS" -keypass "$PASS" \
              -dname "CN=Anti-Social, O=Anti-Social, C=US"
          fi
          echo "AS_KEYSTORE=$RUNNER_TEMP/anti-social.jks" >> "$GITHUB_ENV"
          echo "::add-mask::$PASS"
          echo "AS_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
      - name: Build release APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Name the APK
        run: |
          VERSION=$(node -p "require('./desktop/package.json').version")
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "Anti-Social-$VERSION-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Anti-Social-*-android.apk
          if-no-files-found: error

  release:
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./desktop/package.json').version")
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" out/* --clobber
          else
            gh release create "$TAG" out/* --target "$GITHUB_SHA" \
              --title "$TAG: nobody is here" \
              --notes "Windows installer + portable exe, Linux AppImage + deb, Android APK. Terms of Use: TOUCH GRASS."
          fi
