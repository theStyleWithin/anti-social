name: Build consoles

# Native Anti-Social for Nintendo Switch, Wii U and 3DS. Run it by hand (Actions tab -> Build consoles -> Run workflow),
# or push to the "consoles" branch. build.yml calls it to add the console files to a release.
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [consoles]

jobs:
  host-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke test the shared core
        run: |
          make -C consoles/host VERSION=ci test
          consoles/host/antisocial-host switch /tmp/d /tmp/o "wait:0.5,A,wait:0.2,B,shot:home"
          consoles/host/antisocial-host 3ds /tmp/d3 /tmp/o3 "wait:0.5,A,wait:0.2,B,shot:home"

  switch:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build .nro
        run: |
          VERSION=$(grep -m1 '"version"' desktop/package.json | sed -E 's/.*"([0-9.]+)".*/\1/')
          make -C consoles/switch VERSION=$VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: console-switch
          path: consoles/switch/anti-social.nro
          if-no-files-found: error

  wiiu:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install wut
        run: dkp-pacman -Syu --noconfirm wut wut-tools || dkp-pacman -S --noconfirm wut wut-tools
      - name: Build .rpx and .wuhb
        run: |
          VERSION=$(grep -m1 '"version"' desktop/package.json | sed -E 's/.*"([0-9.]+)".*/\1/')
          export WUT_ROOT=$DEVKITPRO/wut
          make -C consoles/wiiu anti-social.rpx VERSION=$VERSION
          make -C consoles/wiiu anti-social.wuhb VERSION=$VERSION || echo "::warning::the .wuhb bundle could not be built; the .rpx is still fine"
      - uses: actions/upload-artifact@v4
        with:
          name: console-wiiu
          path: |
            consoles/wiiu/anti-social.rpx
            consoles/wiiu/anti-social.wuhb
          if-no-files-found: error

  n3ds:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libctru and tools
        run: dkp-pacman -Syu --noconfirm libctru 3dstools || dkp-pacman -S --noconfirm libctru 3dstools
      - name: Build .3dsx
        run: |
          VERSION=$(grep -m1 '"version"' desktop/package.json | sed -E 's/.*"([0-9.]+)".*/\1/')
          make -C consoles/3ds VERSION=$VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: console-3ds-elf
          path: consoles/3ds/build/anti-social.elf
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: console-3ds
          path: |
            consoles/3ds/anti-social.3dsx
            consoles/3ds/anti-social.cia
          if-no-files-found: error

  n3ds-cia:
    # the .cia tools need a newer system than the devkitPro container has, so this runs on a plain runner
    needs: n3ds
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: console-3ds-elf
          path: consoles/3ds/build
      - name: Build .cia
        run: |
          set +e
          (
          set -e
          mkdir -p /tmp/ct && cd /tmp/ct
          fetch() { curl -fsSL -H "Authorization: Bearer ${{ github.token }}" "https://api.github.com/repos/$1/releases/latest" | grep -o '"browser_download_url": *"[^"]*"' | cut -d'"' -f4 | grep -iE "$2" | head -1; }
          MK=$(fetch 3DSGuy/Project_CTR 'makerom.*(ubuntu|linux).*x86_64|makerom.*(ubuntu|linux)')
          BT=$(fetch carstene1ns/3ds-bannertool 'linux|ubuntu')
          curl -fsSL -o makerom.dl "$MK" && curl -fsSL -o bannertool.dl "$BT"
          for f in makerom bannertool; do mkdir -p $f && (cd $f && (unzip -oq ../$f.dl 2>/dev/null || tar xf ../$f.dl 2>/dev/null || cp ../$f.dl ./$f)); BIN=$(find $f -type f -name $f | head -1); sudo install -m755 "$BIN" /usr/local/bin/$f; done
          cd $GITHUB_WORKSPACE
          VERSION=$(grep -m1 '"version"' desktop/package.json | sed -E 's/.*"([0-9.]+)".*/\1/')
          make -C consoles/3ds cia VERSION=$VERSION
          ) > cia.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then echo "::warning::CIA step: $(tail -12 cia.log | tr '\n' '|' | cut -c1-1500)"; exit $code; fi
      - uses: actions/upload-artifact@v4
        with:
          name: console-3ds-cia
          path: consoles/3ds/anti-social.cia
          if-no-files-found: error
